  const SECONDARY_BTN = `flex w-full min-h-[68px] items-center justify-center gap-2.5 rounded-full border-[3px] border-[#2E6B4A] bg-white px-6 text-[22px] font-bold text-[#1F5136] shadow-[0_5px_0_#A9C7B5] transition-[transform,box-shadow] duration-75 active:translate-y-[5px] active:shadow-[0_0_0_#A9C7B5] focus:outline-none ${FOCUS}`;
  const DANGER_BTN = `flex w-full min-h-[68px] items-center justify-center gap-2.5 rounded-full border-[3px] border-[#8E1426] bg-white px-6 text-[22px] font-bold text-[#8E1426] shadow-[0_5px_0_#E3AEB6] transition-[transform,box-shadow] duration-75 active:translate-y-[5px] active:shadow-[0_0_0_#E3AEB6] focus:outline-none ${FOCUS}`;
  const MARK_STYLE = {
    '○': 'bg-[#CFE2FB] text-[#0B3A8C]',
    '△': 'bg-[#FFE0A8] text-[#6E3200]',
    '×': 'bg-[#F9CBD1] text-[#8E1426]',
  };
  const MARK_LABEL = { '○': 'よくできた', '△': 'まあまあ', '×': 'できなかった' };

  function haptic(ms = 15) {
    try { if (typeof navigator !== 'undefined') navigator.vibrate?.(ms); } catch (e) {}
  }

  const iconAttrs = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  const CheckIcon = (c = 'h-6 w-6') => `<svg ${iconAttrs} stroke-width="3.2" class="${c}"><path d="M5 13l4 4L19 7"/></svg>`;
  const CameraIcon = (c = 'h-6 w-6') => `<svg ${iconAttrs} stroke-width="2.4" class="${c}"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
  const TrashIcon = (c = 'h-6 w-6') => `<svg ${iconAttrs} stroke-width="2.4" class="${c}"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`;

  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  const PageFrame = (inner) => `<div class="relative isolate min-h-screen overflow-x-clip bg-[#FFF4D9] text-xl font-medium leading-[1.7] text-[#3D3D3D]" style="font-family:var(--font-rounded), 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif"><div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10" style="background-image:url('${BG_URL}');background-size:420px auto"></div><div class="mx-auto w-full max-w-md">${inner}</div></div>`;

  const MASCOT_INPUT = `<img src="${MASCOT_INPUT_URL}" alt="" aria-hidden="true" class="h-[108px] w-auto shrink-0 select-none">`;
  const MASCOT_RESULT = `<img src="${MASCOT_RESULT_URL}" alt="" aria-hidden="true" class="h-[96px] w-auto shrink-0 select-none">`;
  const PageHeader = (title, illustration = '') => `<header class="mb-[18px] flex items-center justify-between gap-3 rounded-b-[40px] bg-[#FFEBB0] px-[18px] pb-[26px] pt-6"><div><p class="text-[15px] font-extrabold tracking-wider text-[#1F5136]">VoiceWatch</p><h1 class="mt-0.5 text-[30px] font-extrabold leading-snug">${esc(title)}</h1></div>${illustration}</header>`;

  // カードの角に飾るお花とつる（色ちがい）
  const FLOWER_COLORS = {
    pink: { petal: '#FFC6D0', center: '#FFEFC2' },
    blue: { petal: '#BDDFF7', center: '#FFF0BD' },
    lavender: { petal: '#D9C8F1', center: '#FFEEB5' },
    peach: { petal: '#FFD2A2', center: '#FFF1C4' },
  };
  const FLOWER_OF = { 'me-title': 'pink', 'memo-title': 'blue', 'check-title': 'peach', 'photo-title': 'lavender', 'diary-title': 'pink', 'calendar-title': 'lavender' };
  const LEAF = 'M0 0 C6 -9 16 -9 24 0 C16 9 6 9 0 0Z';
  const BR_LEAVES = [[86, 114, 150], [70, 106, 215], [54, 113, 145], [38, 108, 215], [110, 84, 235], [117, 70, 305], [111, 55, 235], [116, 41, 305]];
  const cardFlowerCorner = (color, corner) => {
    const c = FLOWER_COLORS[color];
    const leaves = BR_LEAVES.map(([x, y, r]) => `<path d="${LEAF}" transform="translate(${x} ${y}) rotate(${r})" fill="#C6F3DC" stroke="#A9E4C6" stroke-width="1"/>`).join('');
    const petals = [0, 1, 2, 3, 4].map((i) => { const a = ((-90 + 72 * i) * Math.PI) / 180; return `<circle cx="${110 + 13.5 * Math.cos(a)}" cy="${110 + 13.5 * Math.sin(a)}" r="10.5" fill="${c.petal}"/>`; }).join('');
    return `<svg viewBox="0 0 130 130" aria-hidden="true" class="pointer-events-none absolute h-[130px] w-[130px] overflow-visible ${corner === 'br' ? '-bottom-3 -right-3' : '-left-3 -top-3 rotate-180'}"><path d="M96 112 C84 121 70 104 56 112 S34 116 24 110 M112 96 C104 84 121 70 112 56 S116 34 110 24" fill="none" stroke="#A9E4C6" stroke-width="4.5" stroke-linecap="round"/>${leaves}${petals}<circle cx="110" cy="110" r="9" fill="${c.center}"/></svg>`;
  };
  const Card = (labelledBy, inner, flower = FLOWER_OF[labelledBy] || 'pink') => `<section aria-labelledby="${labelledBy}" class="relative mb-4 rounded-[28px] bg-white px-[18px] py-[22px]">${cardFlowerCorner(flower, 'tl')}${cardFlowerCorner(flower, 'br')}${inner}</section>`;

  const ReqTag = (required) => `<span class="ml-2 text-base font-bold ${required ? 'text-[#A01C12]' : 'text-[#3D3D3D]'}">${required ? '必須' : '任意'}</span>`;

  const CardTitle = (id, text, required, note) => `<h2 id="${id}" class="mb-3.5"><span class="bg-[linear-gradient(transparent_62%,#FFE29A_62%)] px-1 text-2xl font-extrabold leading-loose">${text}</span>${required !== undefined ? ReqTag(required) : ''}${note ? `<span class="ml-2 text-base font-bold text-[#3D3D3D]">${note}</span>` : ''}</h2>`;

  const BottomBar = (inner, id = '') => `<div ${id ? `id="${id}"` : ''} class="sticky bottom-0 px-3.5 pb-4 pt-[22px]" style="background:linear-gradient(to bottom, rgba(255,244,217,0), #FFF4D9 28%)">${inner}</div>`;

  const MarkBadge = (mark) => `<span aria-hidden="true" class="flex h-[60px] w-[60px] shrink-0 items-center justify-center rounded-full text-[32px] font-extrabold ${MARK_STYLE[mark] ?? 'bg-[#E6E6E6] text-[#333333]'}">${esc(mark)}</span>`;

  // ------------------------------------------------------------
  // コードに無い部分の代用（プレビュー専用）
  // ------------------------------------------------------------
  const MARKS = ['○', '△', '×'];
  const ITEMS = [
    { key: 'exercise', label: '運動量' },
    { key: 'meal', label: '食事バランス' },
    { key: 'sleep', label: '睡眠量' },
  ];
  const ADVICE = {
    exercise: { '○': '体をよく動かせました。この調子で続けましょう。', '△': '少し歩く時間を足せると、さらによさそうです。', '×': 'まずは家の中で、軽く体を動かしてみましょう。' },
    meal: { '○': '食事のバランスがよく取れています。', '△': '野菜やたんぱく質を、あと一品足してみましょう。', '×': '無理のない範囲で、一食ずつ整えていきましょう。' },
    sleep: { '○': 'ぐっすり眠れたようです。', '△': '寝る前に、少しゆったり過ごしてみましょう。', '×': '今日は早めに休めるとよさそうです。' },
  };
  const STAGES = {
    1: { label: 'ほぼ心配なし', message: '今の声に、大きな変化は見られません。', boxClass: 'bg-[#DDF0D8]' },
    2: { label: '少し気をつけて', message: '日々の過ごし方を見直してみましょう。', boxClass: 'bg-[#FFEDB8]' },
    3: { label: '相談をおすすめ', message: '専門の窓口に相談してみましょう。', boxClass: 'bg-[#FFD9BE]' },
  };

  const pad = (n) => String(n).padStart(2, '0');
  const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dateKey = () => keyOf(new Date());
  const SCORE = { '○': 3, '△': 2, '×': 1 };
  const dayLevel = (rec) => {
    const avg = (SCORE[rec.exercise] + SCORE[rec.meal] + SCORE[rec.sleep]) / 3;
    return avg >= 2.5 ? '○' : avg >= 1.5 ? '△' : '×';
  };

  // sessionStorage / records のメモリ版
  const store = {};
  let records = {};
  function seedRecords() {
    records = {};
    const pattern = [['○', '○', '△'], ['△', '○', '○'], ['△', '△', '×'], ['○', '△', '○'], ['×', '△', '△'], ['○', '○', '○']];
    pattern.forEach((p, i) => {
      const d = new Date(); d.setDate(d.getDate() - (i + 1));
      records[keyOf(d)] = { exercise: p[0], meal: p[1], sleep: p[2] };
    });
  }
  seedRecords();
  const loadRecords = () => ({ ...records });
  const saveRecord = (k, rec) => { records[k] = rec; };

  // API のモック（lib/api.ts と同じく 800ms 待って level を返す）
  let previewLevel = 2;
  let failSend = false;
  async function analyze(profile) {
    await new Promise((r) => setTimeout(r, 800));
    if (failSend) throw new Error('サーバーエラー: 500');
    return {
      user_id: 'user_001',
      level: previewLevel,
      suggestions: [
        '散歩や趣味の時間を、毎日の予定に少しずつ入れてみましょう。',
        '家族や友人と話す機会を、意識して増やしてみましょう。',
        '変化が続くようなら、もの忘れ外来などの専門医に相談してみましょう。',
      ],
    };
  }

  // 画像縮小（コードのまま）
  function resizeImage(file, maxSize = 800) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        if (!ctx) { URL.revokeObjectURL(url); return reject(new Error('canvas')); }
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        resolve(canvas.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
      img.src = url;
    });
  }

  // ------------------------------------------------------------
  // ルーター代わりの表示切り替え
  // ------------------------------------------------------------
  const app = document.getElementById('app');
  let view = 'input';
  
  function navigate(to) {
    view = to;
    try { window.scrollTo(0, 0); } catch (e) {}
    mount();
  }
  function mount() {
    if (view === 'input') mountHome(); else mountResult();
  }

  // ------------------------------------------------------------
  // 入力画面 app/page.tsx
  // ------------------------------------------------------------
  function mountHome() {
    const inputClass = `block w-full min-h-16 mt-2.5 rounded-[18px] border-2 border-[#7A7A7A] bg-[#FFFBEF] px-[18px] py-3 text-[22px] font-medium text-[#3D3D3D] placeholder:text-[#6B6B6B] shadow-[inset_0_3px_4px_rgba(0,0,0,0.14)] focus:outline-none ${FOCUS}`;

    const Field = (id, label, required, hint, child) => `<div class="mb-6 last:mb-0"><label for="${id}" class="block text-[22px] font-bold leading-normal">${label}${ReqTag(required)}</label>${hint ? `<p id="${id}-hint" class="text-lg text-[#3D3D3D]">${hint}</p>` : ''}${child}</div>`;

    app.innerHTML = PageFrame(`
      ${PageHeader('きょうの記録', MASCOT_INPUT)}
      <form id="form" novalidate>
        <div class="px-3.5">
          ${Card('me-title', `
            ${CardTitle('me-title', 'あなたのこと')}
            ${Field('name', 'お名前', true, '', `<input id="name" class="${inputClass}" autocomplete="name" placeholder="例: 山田 花子">`)}
            ${Field('age', '年齢', false, '', `<input id="age" class="${inputClass}" type="number" inputmode="numeric" placeholder="例: 72">`)}
            ${Field('hobbies', '趣味', false, 'いくつかあるときは「、」で区切ります', `<input id="hobbies" aria-describedby="hobbies-hint" class="${inputClass}" placeholder="例: 散歩、園芸、料理">`)}
          `)}
          ${Card('memo-title', `
            ${CardTitle('memo-title', 'ひとこと日記', true)}
            <textarea id="memo" aria-labelledby="memo-title" class="${inputClass} !mt-0 min-h-[130px] resize-none leading-[1.7]" placeholder="例: 近場の公園までお散歩してきました。"></textarea>
          `)}
          ${Card('check-title', `
            ${CardTitle('check-title', 'きょうのチェック', true)}
            <div id="marks"></div>
          `)}
          ${Card('photo-title', `
            ${CardTitle('photo-title', '写真', false, '1枚まで')}
            <input id="file" type="file" accept="image/*" class="hidden" tabindex="-1" aria-hidden="true">
            <div id="photoArea"></div>
          `)}
          <div id="errorSlot"></div>
        </div>
        ${BottomBar('<div id="btnSlot"></div>')}
      </form>
    `);

    // 状態
    let name = '', age = '', hobbies = '', memo = '', photo = '';
    let marks = { exercise: '', meal: '', sleep: '' };
    let loading = false, error = '';

    const $ = (id) => document.getElementById(id);

    function renderMarks() {
      $('marks').innerHTML = ITEMS.map((it) => {
        const value = marks[it.key];
        return `<fieldset class="m-0 mb-6 min-w-0 border-0 p-0 last:mb-0"><legend class="p-0 text-[22px] font-bold">${it.label}</legend><div class="mt-3 grid grid-cols-3 gap-2.5 pb-1.5">${MARKS.map((m) => {
          const selected = value === m;
          return `<button type="button" data-key="${it.key}" data-m="${m}" aria-pressed="${selected}" class="relative flex min-h-[104px] flex-col items-center justify-center rounded-[20px] px-0.5 py-1.5 transition-[transform,box-shadow] duration-75 focus:outline-none ${FOCUS} ${selected ? `translate-y-[5px] border-4 border-current shadow-none ${MARK_STYLE[m]}` : 'border-2 border-[#7A7A7A] bg-[#FFFBEF] text-[#3D3D3D] shadow-[0_5px_0_#7A7A7A] active:translate-y-[5px] active:shadow-[0_0_0_#7A7A7A]'}">${selected ? `<span aria-hidden="true" class="absolute -right-1.5 -top-2 flex h-[30px] w-[30px] items-center justify-center rounded-full bg-current">${CheckIcon('h-[18px] w-[18px] text-white')}</span>` : ''}<span aria-hidden="true" class="text-[42px] font-extrabold leading-none">${m}</span><span class="mt-1 text-base font-bold leading-tight">${MARK_LABEL[m] ?? m}</span></button>`;
        }).join('')}</div></fieldset>`;
      }).join('');
    }
    function renderPhoto() {
      $('photoArea').innerHTML = photo
        ? `<img src="${photo}" alt="選んだ写真のプレビュー" class="max-h-80 w-full rounded-2xl bg-[#EDEDED] object-contain"><button type="button" id="photoClear" class="${DANGER_BTN} mt-4">${TrashIcon()}写真を消す</button>`
        : `<button type="button" id="photoPick" class="${SECONDARY_BTN}">${CameraIcon()}写真を選ぶ</button>`;
    }
    function renderError() {
      $('errorSlot').innerHTML = error
        ? `<div role="alert" class="mb-3 rounded-[20px] bg-[#FFE3DD] px-[18px] py-3.5 text-xl"><b class="block text-[21px] text-[#A01C12]">入力を確認してください</b>${esc(error)}</div>`
        : '';
    }
    function renderBtn() {
      $('btnSlot').innerHTML = `<button type="submit" ${loading ? 'disabled' : ''} aria-busy="${loading}" class="${PRIMARY_BTN}">${!loading ? CheckIcon() : ''}${loading ? '送信中…' : '記録を送る'}</button>`;
    }
    const setError = (m) => { error = m; renderError(); };

    async function handlePhoto(e) {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      if (!file.type.startsWith('image/')) return setError('写真のファイルを選んでください。');
      try {
        photo = await resizeImage(file);
        renderPhoto();
        setError('');
      } catch (err) {
        setError('写真を読み込めませんでした。別の写真で試してください。');
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      name = $('name').value; age = $('age').value; hobbies = $('hobbies').value; memo = $('memo').value;

      const ageNum = Number(age);
      if (!name.trim()) return setError('お名前を入力してください。');
      if (!Number.isInteger(ageNum) || ageNum < 0 || ageNum > 120) {
        return setError('年齢は 0〜120 の数字で入力してください。');
      }
      if (!memo.trim()) return setError('ひとこと日記を入力してください。');
      if (!marks.exercise || !marks.meal || !marks.sleep) {
        return setError('運動量・食事バランス・睡眠量を、それぞれ ○△× から選んでください。');
      }

      setError('');
      loading = true; renderBtn();

      const profile = {
        name: name.trim(),
        age: ageNum,
        hobbies: hobbies.split(/[、,，]/).map((s) => s.trim()).filter(Boolean),
        memo: memo.trim(),
      };

      try {
        const result = await analyze(profile);
        store['voicewatch:profile'] = JSON.stringify(profile);
        store['voicewatch:result'] = JSON.stringify(result);

        saveRecord(dateKey(), { exercise: marks.exercise, meal: marks.meal, sleep: marks.sleep });

        try {
          if (photo) store['voicewatch:photo'] = photo;
          else delete store['voicewatch:photo'];
        } catch (err) {}
        haptic(30);
        navigate('result');
      } catch (err) {
        setError('うまく送れませんでした。通信状況を確認して、もう一度試してください。');
        loading = false; renderBtn();
      }
    }

    // イベント
    $('form').addEventListener('submit', handleSubmit);
    $('file').addEventListener('change', handlePhoto);
    ['name', 'age', 'hobbies', 'memo'].forEach((id) => $(id).addEventListener('input', () => { if (error) setError(''); }));
    $('marks').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-m]');
      if (!b) return;
      haptic();
      // 選択中のボタンをもう一度押すと、選択を取り消す
      marks = { ...marks, [b.dataset.key]: marks[b.dataset.key] === b.dataset.m ? '' : b.dataset.m };
      renderMarks();
      if (error) setError('');
    });
    $('photoArea').addEventListener('click', (e) => {
      if (e.target.closest('#photoPick')) $('file').click();
      if (e.target.closest('#photoClear')) { photo = ''; renderPhoto(); if (error) setError(''); }
    });

    renderMarks(); renderPhoto(); renderError(); renderBtn();

  }

  // ------------------------------------------------------------
  // 結果画面 app/result/page.tsx
  // ------------------------------------------------------------
  function mountResult() {
    // useEffect の前（ready=false）
    app.innerHTML = PageFrame(`${PageHeader('結果', MASCOT_RESULT)}<p role="status" class="px-4 text-center text-[22px]">読み込み中…</p>`);

    const myView = view;
    setTimeout(() => {
      if (view !== myView) return;
      let profile = null, result = null, photo = '';
      function load() {
        profile = null; result = null; photo = '';
        try {
          const p = store['voicewatch:profile'];
          const r = store['voicewatch:result'];
          if (p) profile = JSON.parse(p);
          if (r) result = JSON.parse(r);
          photo = store['voicewatch:photo'] ?? '';
        } catch (e) {}
      }
      function render() {
        load();
        const recs = loadRecords();

        if (!result || !STAGES[result.level]) {
          app.innerHTML = PageFrame(`${PageHeader('結果', MASCOT_RESULT)}<p class="mb-6 px-4 text-center text-[22px]">結果がまだありません。</p><div class="px-3.5"><a href="#home" data-nav class="${PRIMARY_BTN}">入力画面にもどる</a></div>`);
          return;
        }

        const stage = STAGES[result.level];
        const level = result.level;
        const today = new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
        const todayRecord = recs[dateKey()];

        const savedBanner = `<div role="status" class="mb-4 flex items-center gap-3 rounded-[22px] bg-[#DDF0D8] px-[18px] py-3.5 text-[21px] font-extrabold text-[#173F29]"><span aria-hidden="true" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-[#2E6B4A] text-white">${CheckIcon('h-[22px] w-[22px]')}</span>きょうの記録を保存しました</div>`;

        const stageCard = `<section aria-labelledby="stage-heading" class="mb-4 flex items-start gap-3 rounded-[28px] px-[18px] py-[22px] ${stage.boxClass}"><div class="min-w-0 flex-1"><h2 id="stage-heading" class="text-[30px] font-extrabold leading-snug">${stage.label}</h2><p class="mt-2 text-[21px]">${stage.message}</p><p class="mb-2.5 mt-[18px] text-[21px] font-extrabold">3段階中 ${level} 段階目</p><ol class="flex gap-3" aria-hidden="true">${[1, 2, 3].map((n) => `<li class="flex h-[58px] w-[58px] items-center justify-center rounded-full text-[28px] font-extrabold ${n <= level ? 'bg-[#2E6B4A] text-white' : 'border-2 border-[#7A7A7A] bg-white text-[#3D3D3D]'}">${n}</li>`).join('')}</ol></div></section>`;

        const diaryCard = profile ? Card('diary-title', `${CardTitle('diary-title', 'きょうのひとこと日記')}${photo ? `<img src="${photo}" alt="日記に添えた写真" class="mb-3 max-h-[28rem] w-full rounded-2xl bg-[#EDEDED] object-contain">` : ''}<p class="text-lg text-[#3D3D3D]">${esc(today)}</p><p class="mt-1 whitespace-pre-wrap break-words text-[22px]">${esc(profile.memo)}</p>`) : '';

        let checkCard = '';
        if (todayRecord) {
          const total = dayLevel(todayRecord);
          checkCard = Card('check-title', `
            ${CardTitle('check-title', 'きょうのチェック')}
            <div class="flex items-center gap-3.5 border-b-2 border-dotted border-[#C9C9C9] pb-4">${MarkBadge(total)}<p class="text-[22px] font-extrabold">きょうの総合：${MARK_LABEL[total] ?? total}</p></div>
            <ul>${ITEMS.map((it) => {
              const mark = todayRecord[it.key];
              return `<li class="flex items-start gap-3.5 border-b-2 border-dotted border-[#C9C9C9] py-4 last:border-b-0 last:pb-0">${MarkBadge(mark)}<div><p class="text-[21px] font-extrabold">${it.label}　${MARK_LABEL[mark] ?? mark}</p><p class="mt-0.5 text-[19px]">${ADVICE[it.key][mark]}</p></div></li>`;
            }).join('')}</ul>`, 'blue');
        }

        const calendarCard = Card('calendar-title', `${CardTitle('calendar-title', '記録カレンダー')}${calendarStandIn(recs)}`);

        app.innerHTML = PageFrame(`
          ${PageHeader(profile ? `${profile.name} さんの結果` : '結果', MASCOT_RESULT)}
          <div class="px-3.5">
            ${todayRecord ? savedBanner : ''}
            ${stageCard}
            ${diaryCard}
            ${checkCard}
            ${calendarCard}
            <p class="mx-1 mb-2 text-[17px] text-[#3D3D3D]">この結果は診断ではありません。気になることがあるときは、専門医にご相談ください。</br>※本ページはデモ用の画面であり、実際の仕様とは異なります。</p>
          </div>
          ${BottomBar(`<a href="#home" data-nav class="${PRIMARY_BTN}">入力画面にもどる</a>`)}
        `);
      }
      render();
    }, 0);
  }

  // カレンダー（コードに無いので仮の見た目。プレビュー専用）
  function calendarStandIn(recs) {
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const wd = ['日', '月', '火', '水', '木', '金', '土'];
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<div></div>';
    for (let d = 1; d <= days; d++) {
      const rec = recs[keyOf(new Date(y, m, d))];
      const isToday = d === now.getDate();
      const lv = rec ? dayLevel(rec) : '';
      cells += `<div class="flex flex-col items-center gap-0.5 py-1 ${isToday ? 'rounded-xl bg-[#FFEBB0]' : ''}"><span class="text-base font-bold">${d}</span>${lv ? `<span class="flex h-8 w-8 items-center justify-center rounded-full text-lg font-extrabold ${MARK_STYLE[lv]}">${lv}</span>` : '<span class="h-8 w-8"></span>'}</div>`;
    }
    return `<p class="mb-2 text-center text-[22px] font-extrabold">${y}年${m + 1}月</p><div class="grid grid-cols-7 gap-y-1 text-center">${wd.map((w) => `<div class="text-base font-bold">${w}</div>`).join('')}${cells}</div>`;
  }

  // 「入力画面にもどる」リンク
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[data-nav]');
    if (!a) return;
    e.preventDefault();
    navigate('input');
  });

  mount();
})();
</script>

</body></html>
